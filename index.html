<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f4ec">
  <meta name="description" content="Музыкальная библиотека с данными о темпе и тональности треков.">
  <title>vgmusiclib — музыкальная библиотека</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f4ec;
      --ink: #18241f;
      --muted: #66736b;
      --line: #d5ddd3;
      --accent: #d94c35;
      --green: #a9c773;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(#18241f0a 1px, transparent 1px), linear-gradient(90deg, #18241f0a 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: "Trebuchet MS", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 0 7.5%;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
    }

    header { border-bottom: 1px solid var(--line); }

    .brand {
      font-size: 18px;
      font-weight: 700;
    }

    .brand-mark { color: var(--accent); }

    .header-note, .eyebrow, .track-count {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .header-note { color: var(--muted); }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 80px 0 96px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--muted);
    }

    .eyebrow::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 68px;
      font-weight: 400;
      line-height: 1.04;
    }

    h1 span { color: var(--accent); }

    .catalogue {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 64px;
      padding: 22px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .empty-state {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 15px;
    }

    .bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
    }

    .bars i {
      display: block;
      width: 3px;
      height: var(--height);
      background: var(--green);
    }

    .track-count { color: var(--muted); white-space: nowrap; }

    footer {
      min-height: 64px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    footer a { color: var(--ink); text-underline-offset: 3px; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .page { padding: 0 22px; }
      header { min-height: 64px; }
      .header-note { font-size: 10px; }
      main { padding: 72px 0; }
      h1 { font-size: 46px; }
      .catalogue { align-items: flex-start; flex-direction: column; gap: 14px; margin-top: 48px; }
      footer { align-items: flex-start; flex-direction: column; justify-content: center; gap: 8px; padding: 16px 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><span class="brand-mark">♪</span> vgmusiclib</div>
      <div class="header-note">Музыкальный каталог</div>
    </header>

    <main>
      <p class="eyebrow">Библиотека · BPM · тональность</p>
      <h1>Музыка в своём <span>ритме.</span></h1>
      <section class="catalogue" aria-label="Состояние каталога">
        <div class="empty-state">
          <div class="bars" aria-hidden="true">
            <i style="--height: 10px"></i><i style="--height: 19px"></i><i style="--height: 13px"></i><i style="--height: 26px"></i><i style="--height: 16px"></i><i style="--height: 22px"></i><i style="--height: 8px"></i>
          </div>
          <span>В каталоге пока нет треков.</span>
        </div>
        <div class="track-count">00 треков</div>
      </section>
    </main>

    <footer>
      <span>Данные о BPM и тональности предоставлены</span>
      <a href="https://getsongbpm.com" rel="noopener noreferrer">GetSongBPM.com</a>
    </footer>
  </div>
</body>
</html>
